services:
  mongo:
    image: docker.io/library/mongo:8.0@sha256:376f5173003b5408d7b8e6989667231c0bf0cefdce379d7c814910429d1a7a85
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' | grep -qx 1"]
      interval: 5s
      timeout: 5s
      retries: 12

  mongo-seed:
    image: docker.io/library/mongo:8.0@sha256:376f5173003b5408d7b8e6989667231c0bf0cefdce379d7c814910429d1a7a85
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./mongodb_backup/leanote_install_data:/leanote_install_data:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >-
        if [ "$$(mongosh --quiet --host mongo --eval
        'db.getSiblingDB("leanote").getCollectionNames().length')" -gt 0 ]; then exit 0; fi;
        mongorestore --host mongo --db leanote --dir /leanote_install_data --drop

  gotenberg:
    image: docker.io/gotenberg/gotenberg:8.37.0@sha256:f29984bd1e226bf1b93ba90af06000afa8b315853e99d27b9aaa41b93f15c769
    restart: unless-stopped
    command:
      - gotenberg
      - --api-timeout=40s
      - --libreoffice-disable-routes=true
      - --pdfengines-disable-routes=true
      - --webhook-disable=true
      - --chromium-deny-list=^(?!file:///tmp/|data:).*
    networks:
      - pdf
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/health"]
      interval: 5s
      timeout: 5s
      retries: 12

  leanote:
    platform: linux/amd64
    image: ghcr.io/yangphere/leanote:${LEANOTE_IMAGE_TAG:?LEANOTE_IMAGE_TAG must be set}
    restart: unless-stopped
    depends_on:
      mongo-seed:
        condition: service_completed_successfully
      gotenberg:
        condition: service_healthy
    networks:
      - default
      - pdf
    environment:
      LEANOTE_LANGUAGE: ${LEANOTE_LANGUAGE:?LEANOTE_LANGUAGE must be set}
      MONGODB_URL: ${MONGODB_URL:?MONGODB_URL must be set}
      LEANOTE_SITE_URL: ${LEANOTE_SITE_URL:?LEANOTE_SITE_URL must be set}
      LEANOTE_APP_SECRET: ${LEANOTE_APP_SECRET:?LEANOTE_APP_SECRET must be set}
      LEANOTE_ADMIN_EMAIL: ${LEANOTE_ADMIN_EMAIL:?LEANOTE_ADMIN_EMAIL must be set}
      LEANOTE_ADMIN_INITIAL_PASSWORD: ${LEANOTE_ADMIN_INITIAL_PASSWORD:?LEANOTE_ADMIN_INITIAL_PASSWORD must be set}
      LEANOTE_ADMIN_FORCE_ENV_PASSWORD: ${LEANOTE_ADMIN_FORCE_ENV_PASSWORD:-false}
    ports:
      - "${LEANOTE_HTTP_PORT:?LEANOTE_HTTP_PORT must be set}:9000"
    volumes:
      - leanote-data:/var/lib/leanote

networks:
  pdf:
    internal: true

volumes:
  mongo-data:
  leanote-data:
