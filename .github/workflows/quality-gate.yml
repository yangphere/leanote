name: Quality gate

on:
  workflow_call:

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

permissions:
  contents: read

env:
  GOTOOLCHAIN: local
  NODE_VERSION: '24.20.0'

jobs:
  go-1_26_7:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Initialize early-failure summary
