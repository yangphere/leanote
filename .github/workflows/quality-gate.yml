        with: { clean: false }
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with: { go-version: '1.26.7', cache: true }
      - name: Install MongoDB Database Tools
        run: |
          version=100.10.0
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          curl -fsSL "https://fastdl.mongodb.org/tools/db/mongodb-database-tools-ubuntu2204-x86_64-${version}.tgz" -o "$tmp/tools.tgz"
          tar -xzf "$tmp/tools.tgz" -C "$tmp"
          sudo install -m 0755 "$tmp/mongodb-database-tools-ubuntu2204-x86_64-${version}/bin/mongorestore" /usr/local/bin/mongorestore
