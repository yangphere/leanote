          count=$(go test ./app/tests/... -list '^Test' | grep -c '^Test' || true)
          test "$count" -gt 0
          LEANOTE_GOLDEN=replay LEANOTE_REQUIRE_MONGO=1 go test -p 1 ./app/tests/... -count=1 -timeout 30m
          echo "CI_DISCOVERED_COUNT=$count" >> "$GITHUB_ENV"
          echo "CI_EXECUTED_COUNT=$count" >> "$GITHUB_ENV"
