      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { clean: false }
      - name: Build deterministic container candidate
        run: |
          epoch=$(git show -s --format=%ct "$GITHUB_SHA")
          created=$(date -u -d "@$epoch" +%Y-%m-%dT%H:%M:%SZ)
          docker build --platform linux/amd64 --build-arg VERSION="$(node scripts/version.mjs)" --build-arg REVISION="$GITHUB_SHA" --build-arg SOURCE_DATE_EPOCH="$created" --provenance=false --sbom=false -t leanote:ci .
      - name: Run container smoke
        env:
          CONTAINER_SMOKE_PDF_URL: http://127.0.0.1:9000/note/toPdf?noteId=5483207cf4e87203a4000001&appKey=container-smoke-secret-012345678901234567890
        run: |
          scripts/container-smoke.sh leanote:ci
          echo 'CI_DISCOVERED_COUNT=1' >> "$GITHUB_ENV"
          echo 'CI_EXECUTED_COUNT=1' >> "$GITHUB_ENV"
          echo 'CI_HEALTH_PATH=/healthz' >> "$GITHUB_ENV"
          echo 'CI_SERVICE_READINESS=passed' >> "$GITHUB_ENV"
          echo 'CI_HTTP_STATUS=200' >> "$GITHUB_ENV"
      - name: Write summary
        if: always()
        env: { CI_JOB_ID: container-smoke, CI_JOB_STATUS: '${{ job.status }}', CI_DISCOVERY: passed }
        run: |
          set +e
          node scripts/ci/write-summary.mjs
          rc=$?
          set -e
          if [ ! -s "ci-summaries/${CI_JOB_ID}.json" ]; then
            CI_FORCE_FALLBACK=true node scripts/ci/write-summary.mjs || rc=$?
          fi
          exit "$rc"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: { name: ci-summary-container-smoke, path: ci-summaries/container-smoke.json, retention-days: 7, if-no-files-found: error }

  summary:
    if: always()
    needs: [go-1_26_7, go-1_27_0, mongo-8_0, node-build, chromium-e2e, package-smoke, container-smoke]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Initialize early-failure summary
        if: always()
        env: { CI_JOB_ID: summary }
        run: |
          python3 -c 'import datetime,json,os,pathlib,sys; j=sys.argv[1]; s=os.environ["GITHUB_SHA"]; a=os.environ["GITHUB_RUN_ATTEMPT"]; r=os.environ["GITHUB_RUN_ID"]; w=os.environ["GITHUB_WORKFLOW"]; ref=os.environ["GITHUB_REF"]; assert len(s)==40 and all(c in "0123456789abcdef" for c in s) and a.isdigit() and int(a)>0 and r.isdigit() and int(r)>0 and w and ref; x={"schema_version":"leanote.ci.failure-summary.v1","workflow":w,"job":j,"run":{"id":r,"attempt":int(a)},"commit":s,"ref":ref,"status":"failed","stage":"job_not_started","toolchain":{"go":None,"node":None,"npm":None,"mongo":None,"playwright":None},"failure":{"category":"job_not_started","message":"job_not_started","exit_code":None},"service":{"health_path":None,"readiness":"not_run","http_status":None,"exit_code":None},"tests":{"discovery":"not_run","discovered_count":None,"executed_count":None},"page_paths":[],"resource_paths":[],"status_codes":[],"generated_at":datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds").replace("+00:00","Z")}; pathlib.Path("ci-summaries").mkdir(exist_ok=True); pathlib.Path("ci-summaries",j+".json").write_text(json.dumps(x)+"\\n")' "$CI_JOB_ID"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { clean: false }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: { pattern: ci-summary-*, path: ci-summaries, merge-multiple: true }
      - name: Validate every quality summary
        run: |
          node scripts/ci/validate-summaries.mjs ci-summaries
          echo 'CI_DISCOVERED_COUNT=7' >> "$GITHUB_ENV"
          echo 'CI_EXECUTED_COUNT=7' >> "$GITHUB_ENV"
      - name: Write summary
        if: always()
        env: { CI_JOB_ID: summary, CI_JOB_STATUS: '${{ job.status }}', CI_DISCOVERY: passed }
        run: |
          set +e
          node scripts/ci/write-summary.mjs
          rc=$?
          set -e
          if [ ! -s "ci-summaries/${CI_JOB_ID}.json" ]; then
            CI_FORCE_FALLBACK=true node scripts/ci/write-summary.mjs || rc=$?
          fi
          exit "$rc"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: { name: ci-summary-summary, path: ci-summaries/summary.json, retention-days: 7, if-no-files-found: error }

  release-inputs:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [summary]
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { ref: '${{ github.sha }}', fetch-depth: 0 }
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with: { node-version: '24.20.0' }
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: { name: leanote-package, path: dist }
      - name: Build release image and metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          GIT_COMMIT: ${{ github.sha }}
          BASE_IMAGE_DIGEST: sha256:5ae3c39ebd15e229dcedd5cee596b2497182493d41ff162e824ba13fc1b2b867
          PROVENANCE: disabled
          ATTESTATION: disabled
          SBOM: disabled
        run: |
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$GITHUB_SHA")
          created=$(date -u -d "@$SOURCE_DATE_EPOCH" +%Y-%m-%dT%H:%M:%SZ)
          docker buildx build --platform linux/amd64 --load --metadata-file dist/image-metadata.json --build-arg VERSION="${RELEASE_TAG#v}" --build-arg REVISION="$GITHUB_SHA" --build-arg SOURCE_DATE_EPOCH="$created" --provenance=false --sbom=false -t "leanote:${RELEASE_TAG}" .
          IMAGE_DIGEST=$(node -e "const m=require('./dist/image-metadata.json'); process.stdout.write(m['containerimage.digest'] || '')")
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          export SOURCE_DATE_EPOCH IMAGE_DIGEST
          node scripts/release-metadata.mjs
          rm dist/image-metadata.json
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 5
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: leanote-release-inputs-v1
          path: |
            dist/release-inputs.json
            dist/leanote-v*-linux-amd64.tar.gz
            dist/leanote-v*-linux-amd64.tar.gz.sha256
            dist/build-metadata.json
            dist/image-build-inputs.json
          retention-days: 7
          if-no-files-found: error
