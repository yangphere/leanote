name: Docker image

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      operation:
        description: Recover an absent version tag or promote a verified version to latest
        required: true
        default: recover_version
        type: choice
        options: [recover_version, update_latest]
      tag:
        description: Existing immutable numeric image tag
        required: true
        type: string
      expected_commit:
        description: Commit currently referenced by the tag
        required: true
        type: string
      expected_registry_digest:
        description: Required immutable version manifest digest for update_latest
        required: false
        type: string
      expected_config_digest:
        description: Required immutable version config digest for update_latest
        required: false
        type: string
      source_run_id:
        description: Failed Docker image run whose quality evidence is reused
        required: true
        type: string
      source_run_attempt:
        description: Exact source run attempt
        required: true
        type: string

concurrency:
  group: docker-image-latest
  queue: max
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    if: github.repository == 'yangphere/leanote'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
      candidate_sha: ${{ steps.identity.outputs.candidate_sha }}
      operation: ${{ steps.identity.outputs.operation }}
      expected_registry_digest: ${{ steps.identity.outputs.expected_registry_digest }}
      expected_config_digest: ${{ steps.identity.outputs.expected_config_digest }}
    steps:
      - name: Check out the trusted executor
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { ref: '${{ github.sha }}', fetch-depth: 0, path: executor }
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with: { node-version: '24.20.0' }
      - name: Resolve the immutable candidate identity
        id: identity
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_TAG: ${{ github.ref_name }}
          PUSH_SHA: ${{ github.sha }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_COMMIT: ${{ inputs.expected_commit }}
          INPUT_OPERATION: ${{ inputs.operation }}
          INPUT_EXPECTED_REGISTRY_DIGEST: ${{ inputs.expected_registry_digest }}
          INPUT_EXPECTED_CONFIG_DIGEST: ${{ inputs.expected_config_digest }}
          INPUT_SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          INPUT_SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
        run: |
          set -eu
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            test "$GITHUB_REF" = refs/heads/main
            TAG=$INPUT_TAG
            CANDIDATE_SHA=$INPUT_COMMIT
            OPERATION=$INPUT_OPERATION
            test -n "$INPUT_SOURCE_RUN_ID"
            test -n "$INPUT_SOURCE_RUN_ATTEMPT"
            case "$OPERATION" in
              recover_version)
                test -z "$INPUT_EXPECTED_REGISTRY_DIGEST"
                test -z "$INPUT_EXPECTED_CONFIG_DIGEST"
                ;;
              update_latest)
                EXPECTED_REGISTRY_DIGEST="$INPUT_EXPECTED_REGISTRY_DIGEST" EXPECTED_CONFIG_DIGEST="$INPUT_EXPECTED_CONFIG_DIGEST" node -e "const p=/^sha256:[0-9a-f]{64}$/; if(!p.test(process.env.EXPECTED_REGISTRY_DIGEST || '') || !p.test(process.env.EXPECTED_CONFIG_DIGEST || '')) process.exit(1)"
                ;;
              *) exit 1 ;;
            esac
          else
            TAG=$PUSH_TAG
            CANDIDATE_SHA=$PUSH_SHA
            OPERATION=publish
          fi
          RELEASE_TAG="$TAG" node --input-type=module -e "import { assertImageTagFormat } from './executor/scripts/version.mjs'; assertImageTagFormat(process.env.RELEASE_TAG)"
          CANDIDATE_SHA="$CANDIDATE_SHA" node -e "if (!/^(?!0{40}$)[0-9a-f]{40}$/.test(process.env.CANDIDATE_SHA || '')) process.exit(1)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "candidate_sha=$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"
          echo "operation=$OPERATION" >> "$GITHUB_OUTPUT"
          echo "expected_registry_digest=$INPUT_EXPECTED_REGISTRY_DIGEST" >> "$GITHUB_OUTPUT"
          echo "expected_config_digest=$INPUT_EXPECTED_CONFIG_DIGEST" >> "$GITHUB_OUTPUT"
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "CANDIDATE_SHA=$CANDIDATE_SHA" >> "$GITHUB_ENV"
      - name: Check out the immutable candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { ref: '${{ steps.identity.outputs.candidate_sha }}', fetch-depth: 0, path: candidate }
      - name: Validate canonical candidate version
        working-directory: candidate
        run: node "$GITHUB_WORKSPACE/executor/scripts/check-version.mjs" --image-tag
      - name: Reject forced tag updates
        env: { TAG_WAS_FORCED: '${{ github.event.forced }}' }
        run: test "$TAG_WAS_FORCED" != true
      - name: Verify immutable tag and main ancestry
        working-directory: executor
        run: |
          set -eu
          git fetch --force --no-tags origin \
            "refs/tags/${RELEASE_TAG}:refs/remotes/origin/tags/${RELEASE_TAG}" \
            "refs/heads/main:refs/remotes/origin/main"
          test "$(git rev-parse "refs/remotes/origin/tags/${RELEASE_TAG}^{}")" = "$CANDIDATE_SHA"
          git merge-base --is-ancestor "$CANDIDATE_SHA" refs/remotes/origin/main
      - name: Verify the original failed run and successful candidate gates
        if: github.event_name == 'workflow_dispatch'
        working-directory: executor
        env:
          GH_TOKEN: '${{ github.token }}'
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
        run: node scripts/verify-image-source-run.mjs
      - name: Download the original run summaries
        if: github.event_name == 'workflow_dispatch'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}
          pattern: ci-summary-*
          path: source-summaries
          merge-multiple: true
      - name: Validate the original run summary provenance
        if: github.event_name == 'workflow_dispatch'
        working-directory: executor
        env:
          SOURCE_COMMIT: ${{ inputs.expected_commit }}
          SOURCE_REF: refs/tags/${{ inputs.tag }}
          SOURCE_WORKFLOW: Docker image
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
        run: node scripts/ci/validate-summaries.mjs "$GITHUB_WORKSPACE/source-summaries" --include-summary --source-execution

  quality-gate:
    needs: [validate]
    uses: ./.github/workflows/quality-gate.yml

  publish:
    needs: [validate, quality-gate]
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
    env:
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
      CANDIDATE_SHA: ${{ needs.validate.outputs.candidate_sha }}
      OPERATION: ${{ needs.validate.outputs.operation }}
      EXPECTED_REGISTRY_DIGEST: ${{ needs.validate.outputs.expected_registry_digest }}
      EXPECTED_CONFIG_DIGEST: ${{ needs.validate.outputs.expected_config_digest }}
      IMAGE_REPOSITORY: ghcr.io/yangphere/leanote
      GHCR_IMAGE: yangphere/leanote
      SKOPEO_IMAGE: quay.io/skopeo/stable@sha256:249b92db7297e5c801e19172dbb3b56fde88094a49740a5ededac8c2958bf2c0
    steps:
      - name: Check out the trusted executor
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { ref: '${{ github.sha }}', fetch-depth: 0, path: executor }
      - name: Check out the immutable candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { ref: '${{ needs.validate.outputs.candidate_sha }}', fetch-depth: 0, path: candidate }
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with: { node-version: '24.20.0' }
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
        if: needs.validate.outputs.operation != 'update_latest'
      - name: Load the digest-preserving image copy tool
        run: |
          set -eu
          docker pull "$SKOPEO_IMAGE"
          docker run --rm "$SKOPEO_IMAGE" --version
      - name: Resolve the registry image tag
        run: |
          echo "IMAGE=${IMAGE_REPOSITORY}:${RELEASE_TAG}" >> "$GITHUB_ENV"
          echo "LATEST_IMAGE=${IMAGE_REPOSITORY}:latest" >> "$GITHUB_ENV"
      - name: Build the immutable candidate
        if: needs.validate.outputs.operation != 'update_latest'
        working-directory: candidate
        run: |
          set -eu
          epoch=$(git show -s --format=%ct "$CANDIDATE_SHA")
          created=$(date -u -d "@$epoch" +%Y-%m-%dT%H:%M:%SZ)
          docker buildx build --platform linux/amd64 --load --output type=oci,dest="$RUNNER_TEMP/candidate.oci.tar" --metadata-file "$RUNNER_TEMP/image-metadata.json" --build-arg VERSION="$RELEASE_TAG" --build-arg REVISION="$CANDIDATE_SHA" --build-arg SOURCE_DATE_EPOCH="$epoch" --build-arg OCI_CREATED="$created" --provenance=false --sbom=false -t "$IMAGE" .
          expected_manifest=$(node -e "process.stdout.write(require(process.env.RUNNER_TEMP + '/image-metadata.json')['containerimage.digest'] || '')")
          expected_config=$(node -e "process.stdout.write(require(process.env.RUNNER_TEMP + '/image-metadata.json')['containerimage.config.digest'] || '')")
          local_config=$(docker image inspect "$IMAGE" --format '{{.Id}}')
          skopeo() { docker run --rm --mount "type=bind,source=$RUNNER_TEMP,target=/work" "$SKOPEO_IMAGE" "$@"; }
          skopeo inspect --raw oci-archive:/work/candidate.oci.tar > "$RUNNER_TEMP/archive-manifest.json"
          archive_config=$(IMAGE_MANIFEST_PATH="$RUNNER_TEMP/archive-manifest.json" EXPECTED_MANIFEST_DIGEST="$expected_manifest" EXPECTED_CONFIG_DIGEST="$expected_config" node "$GITHUB_WORKSPACE/executor/scripts/verify-image-manifest.mjs")
          test "$archive_config" = "$local_config"
      - name: Smoke the exact candidate
        if: needs.validate.outputs.operation != 'update_latest'
        working-directory: candidate
        env:
          CONTAINER_SMOKE_PDF_URL: http://127.0.0.1:9000/note/toPdf?noteId=5483207cf4e87203a4000001&appKey=container-smoke-secret-012345678901234567890
        run: scripts/container-smoke.sh "$IMAGE"
      - name: Push once and verify registry manifest digest
        if: needs.validate.outputs.operation != 'update_latest'
        working-directory: candidate
        env:
          GH_TOKEN: '${{ github.token }}'
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -eu
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          skopeo() { docker run --rm --network host --mount "type=bind,source=$RUNNER_TEMP,target=/work" --mount "type=bind,source=$HOME/.docker,target=/root/.docker,readonly" "$SKOPEO_IMAGE" "$@"; }
          node "$GITHUB_WORKSPACE/executor/scripts/check-ghcr-tag-absent.mjs"
          git fetch --force --no-tags origin \
            "refs/tags/${TAG}:refs/remotes/origin/tags/${TAG}" \
            "refs/heads/main:refs/remotes/origin/main"
          test "$(git rev-parse "refs/remotes/origin/tags/${TAG}^{}")" = "$CANDIDATE_SHA"
          git merge-base --is-ancestor "$CANDIDATE_SHA" refs/remotes/origin/main
          expected_manifest=$(node -e "process.stdout.write(require(process.env.RUNNER_TEMP + '/image-metadata.json')['containerimage.digest'])")
          expected_config=$(node -e "process.stdout.write(require(process.env.RUNNER_TEMP + '/image-metadata.json')['containerimage.config.digest'])")
          skopeo copy --preserve-digests --dest-authfile /root/.docker/config.json oci-archive:/work/candidate.oci.tar docker://"$IMAGE"
          skopeo inspect --authfile /root/.docker/config.json --raw docker://"$IMAGE" > "$RUNNER_TEMP/version-manifest.json"
          IMAGE_MANIFEST_PATH="$RUNNER_TEMP/version-manifest.json" EXPECTED_MANIFEST_DIGEST="$expected_manifest" EXPECTED_CONFIG_DIGEST="$expected_config" node "$GITHUB_WORKSPACE/executor/scripts/verify-image-manifest.mjs"
          skopeo list-tags --authfile /root/.docker/config.json docker://"$IMAGE_REPOSITORY" > "$RUNNER_TEMP/latest-tags.json"
          has_latest=$(node "$GITHUB_WORKSPACE/executor/scripts/check-latest-promotion.mjs" --has-latest "$RUNNER_TEMP/latest-tags.json" "$IMAGE_REPOSITORY")
          if [ "$has_latest" = true ]; then
            skopeo inspect --authfile /root/.docker/config.json --config docker://"$LATEST_IMAGE" > "$RUNNER_TEMP/latest-config.json"
          fi
          promote_latest=$(node "$GITHUB_WORKSPACE/executor/scripts/check-latest-promotion.mjs" --should-promote "$RUNNER_TEMP/latest-tags.json" "$RUNNER_TEMP/latest-config.json" "$IMAGE_REPOSITORY" "$RELEASE_TAG")
          if [ "$promote_latest" = false ]; then
            echo "Skipping latest promotion: candidate $RELEASE_TAG is not newer than the current latest version"
            exit 0
          fi
          echo "Promoting candidate $RELEASE_TAG to latest after registry version guard"
          skopeo copy --preserve-digests --dest-authfile /root/.docker/config.json oci-archive:/work/candidate.oci.tar docker://"$LATEST_IMAGE"
          skopeo inspect --authfile /root/.docker/config.json --raw docker://"$LATEST_IMAGE" > "$RUNNER_TEMP/latest-manifest.json"
          IMAGE_MANIFEST_PATH="$RUNNER_TEMP/latest-manifest.json" EXPECTED_MANIFEST_DIGEST="$expected_manifest" EXPECTED_CONFIG_DIGEST="$expected_config" node "$GITHUB_WORKSPACE/executor/scripts/verify-image-manifest.mjs"
      - name: Verify immutable version and update latest
        if: needs.validate.outputs.operation == 'update_latest'
        working-directory: candidate
        env:
          GH_TOKEN: '${{ github.token }}'
          TAG: ${{ needs.validate.outputs.tag }}
          CONTAINER_SMOKE_PDF_URL: http://127.0.0.1:9000/note/toPdf?noteId=5483207cf4e87203a4000001&appKey=container-smoke-secret-012345678901234567890
        run: |
          set -eu
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          skopeo() { docker run --rm --network host --mount "type=bind,source=$RUNNER_TEMP,target=/work" --mount "type=bind,source=$HOME/.docker,target=/root/.docker,readonly" "$SKOPEO_IMAGE" "$@"; }
          VERSION_SOURCE="${IMAGE_REPOSITORY}@${EXPECTED_REGISTRY_DIGEST}"
          skopeo inspect --authfile /root/.docker/config.json --raw docker://"$IMAGE" > "$RUNNER_TEMP/version-tag-manifest.json"
          version_config=$(IMAGE_MANIFEST_PATH="$RUNNER_TEMP/version-tag-manifest.json" EXPECTED_MANIFEST_DIGEST="$EXPECTED_REGISTRY_DIGEST" EXPECTED_CONFIG_DIGEST="$EXPECTED_CONFIG_DIGEST" node "$GITHUB_WORKSPACE/executor/scripts/verify-image-manifest.mjs")
          docker pull "$VERSION_SOURCE"
          test "$(docker image inspect "$VERSION_SOURCE" --format '{{.Id}}')" = "$version_config"
          test "$(docker image inspect "$VERSION_SOURCE" --format '{{.Os}}/{{.Architecture}}')" = linux/amd64
          test "$(docker image inspect "$VERSION_SOURCE" --format '{{index .Config.Labels "org.opencontainers.image.version"}}')" = "$RELEASE_TAG"
          test "$(docker image inspect "$VERSION_SOURCE" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$CANDIDATE_SHA"
          test "$(docker image inspect "$VERSION_SOURCE" --format '{{index .Config.Labels "org.opencontainers.image.source"}}')" = https://github.com/yangphere/leanote
          scripts/container-smoke.sh "$VERSION_SOURCE"
          git fetch --force --no-tags origin \
            "refs/tags/${TAG}:refs/remotes/origin/tags/${TAG}" \
            "refs/heads/main:refs/remotes/origin/main"
          test "$(git rev-parse "refs/remotes/origin/tags/${TAG}^{}")" = "$CANDIDATE_SHA"
          git merge-base --is-ancestor "$CANDIDATE_SHA" refs/remotes/origin/main
          skopeo list-tags --authfile /root/.docker/config.json docker://"$IMAGE_REPOSITORY" > "$RUNNER_TEMP/latest-tags.json"
          has_latest=$(node "$GITHUB_WORKSPACE/executor/scripts/check-latest-promotion.mjs" --has-latest "$RUNNER_TEMP/latest-tags.json" "$IMAGE_REPOSITORY")
          if [ "$has_latest" = true ]; then
            skopeo inspect --authfile /root/.docker/config.json --config docker://"$LATEST_IMAGE" > "$RUNNER_TEMP/latest-config.json"
          fi
          promote_latest=$(node "$GITHUB_WORKSPACE/executor/scripts/check-latest-promotion.mjs" --should-promote "$RUNNER_TEMP/latest-tags.json" "$RUNNER_TEMP/latest-config.json" "$IMAGE_REPOSITORY" "$RELEASE_TAG")
          if [ "$promote_latest" = false ]; then
            echo "Skipping latest promotion: candidate $RELEASE_TAG is not newer than the current latest version"
            exit 0
          fi
          echo "Promoting candidate $RELEASE_TAG to latest after registry version guard"
          skopeo copy --preserve-digests --src-authfile /root/.docker/config.json --dest-authfile /root/.docker/config.json docker://"$VERSION_SOURCE" docker://"$LATEST_IMAGE"
          skopeo inspect --authfile /root/.docker/config.json --raw docker://"$LATEST_IMAGE" > "$RUNNER_TEMP/latest-manifest.json"
          IMAGE_MANIFEST_PATH="$RUNNER_TEMP/latest-manifest.json" EXPECTED_MANIFEST_DIGEST="$EXPECTED_REGISTRY_DIGEST" EXPECTED_CONFIG_DIGEST="$EXPECTED_CONFIG_DIGEST" node "$GITHUB_WORKSPACE/executor/scripts/verify-image-manifest.mjs"
