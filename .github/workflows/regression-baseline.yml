name: Regression baseline

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  go-replay:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.20.14'
      - name: Install wkhtmltopdf 0.12.6.1 for ExportPdf replay
        shell: bash
        run: |
          wget -q -O wkhtmltox_0.12.6.1-3.jammy_amd64.deb https://github.com/wkhtmltopdf/packaging/releases/download/0.12.6.1-3/wkhtmltox_0.12.6.1-3.jammy_amd64.deb
          echo '4f723b2691ad8638a9df960e0421d346d7315083e3583a334f33362280ddba15  wkhtmltox_0.12.6.1-3.jammy_amd64.deb' | sha256sum -c -
          sudo dpkg -i wkhtmltox_0.12.6.1-3.jammy_amd64.deb || (sudo apt-get -f install -y && sudo dpkg -i wkhtmltox_0.12.6.1-3.jammy_amd64.deb)
          test -x /usr/local/bin/wkhtmltopdf
      - name: Start MongoDB 5.0 fixture
        shell: bash
        run: |
          docker rm -f leanote-test-mongo >/dev/null 2>&1 || true
          docker run -d --rm --name leanote-test-mongo -p 27017:27017 mongo:5.0
          deadline=$((SECONDS + 60))
          while true; do
            ping="$(docker exec leanote-test-mongo mongosh --quiet --eval 'db.runCommand({ping:1}).ok' 2>/dev/null || true)"
            if [ "$(printf '%s' "$ping" | tr -d '[:space:]')" = '1' ]; then break; fi
            if [ "$SECONDS" -ge "$deadline" ]; then echo 'Mongo ping timeout after 60s' >&2; exit 1; fi
            sleep 0.5
          done
          docker cp mongodb_backup/leanote_install_data leanote-test-mongo:/
          docker exec leanote-test-mongo mongorestore --db leanote_test --dir /leanote_install_data --drop
          test "$(docker exec leanote-test-mongo mongosh --quiet leanote_test --eval 'db.users.countDocuments()' | tr -d '[:space:]')" = '2'
      - name: Verify legacy auth test
        env:
          LEANOTE_REQUIRE_MONGO: '1'
        run: go test -p 1 ./app/tests/ -run '^TestAuth$' -count=1 -timeout 60s
      - name: Replay Go baseline
        env:
          LEANOTE_GOLDEN: replay
          LEANOTE_TEST_GO: go
        run: go test -p 1 ./app/tests/... -count=1 -timeout 30m
      - name: Remove MongoDB fixture
        if: always()
        run: docker rm -f leanote-test-mongo >/dev/null 2>&1 || true

  node-tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - run: npm test

  record-export-pdf:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.20.14'
      - name: Install wkhtmltopdf 0.12.6.1
        shell: bash
        run: |
          wget -q -O wkhtmltox_0.12.6.1-3.jammy_amd64.deb https://github.com/wkhtmltopdf/packaging/releases/download/0.12.6.1-3/wkhtmltox_0.12.6.1-3.jammy_amd64.deb
          echo '4f723b2691ad8638a9df960e0421d346d7315083e3583a334f33362280ddba15  wkhtmltox_0.12.6.1-3.jammy_amd64.deb' | sha256sum -c -
          sudo dpkg -i wkhtmltox_0.12.6.1-3.jammy_amd64.deb || (sudo apt-get -f install -y && sudo dpkg -i wkhtmltox_0.12.6.1-3.jammy_amd64.deb)
          test -x /usr/local/bin/wkhtmltopdf
      - name: Start MongoDB 5.0 fixture
        shell: bash
        run: |
          docker rm -f leanote-test-mongo >/dev/null 2>&1 || true
          docker run -d --rm --name leanote-test-mongo -p 27017:27017 mongo:5.0
          deadline=$((SECONDS + 60))
          while true; do
            ping="$(docker exec leanote-test-mongo mongosh --quiet --eval 'db.runCommand({ping:1}).ok' 2>/dev/null || true)"
            if [ "$(printf '%s' "$ping" | tr -d '[:space:]')" = '1' ]; then break; fi
            if [ "$SECONDS" -ge "$deadline" ]; then echo 'Mongo ping timeout after 60s' >&2; exit 1; fi
            sleep 0.5
          done
          docker cp mongodb_backup/leanote_install_data leanote-test-mongo:/
          docker exec leanote-test-mongo mongorestore --db leanote_test --dir /leanote_install_data --drop
          test "$(docker exec leanote-test-mongo mongosh --quiet leanote_test --eval 'db.users.countDocuments()' | tr -d '[:space:]')" = '2'
      - name: Record ExportPdf golden
        env:
          LEANOTE_GOLDEN: record
          LEANOTE_TEST_GO: go
        run: go test -p 1 ./app/tests/... -count=1 -timeout 30m -run '^TestGoldenExportPdf$'
      - name: Upload ExportPdf golden for review
        uses: actions/upload-artifact@v4
        with:
          name: export-pdf-golden
          path: app/tests/golden/api/note_exportPdf.json
          if-no-files-found: error
      - name: Remove MongoDB fixture
        if: always()
        run: docker rm -f leanote-test-mongo >/dev/null 2>&1 || true
