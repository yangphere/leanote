name: Regression baseline

on:
  pull_request:
  push:
  workflow_dispatch:

concurrency:
  group: regression-baseline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-replay:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.26.7', '1.27.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
      - name: Build application packages
        run: go build ./app/...
      - name: Vet application packages
        run: go vet ./app/...
      - name: Run DB-independent unit tests
        run: go test ./app/info/... ./app/lea/... ./app/cmd/... -count=1
      - name: Install wkhtmltopdf 0.12.6.1 for ExportPdf replay
        shell: bash
        run: |
          wget -q -O wkhtmltox_0.12.6.1-3.jammy_amd64.deb https://github.com/wkhtmltopdf/packaging/releases/download/0.12.6.1-3/wkhtmltox_0.12.6.1-3.jammy_amd64.deb
          echo '4f723b2691ad8638a9df960e0421d346d7315083e3583a334f33362280ddba15  wkhtmltox_0.12.6.1-3.jammy_amd64.deb' | sha256sum -c -
          sudo dpkg -i wkhtmltox_0.12.6.1-3.jammy_amd64.deb || (sudo apt-get -f install -y && sudo dpkg -i wkhtmltox_0.12.6.1-3.jammy_amd64.deb)
          test -x /usr/local/bin/wkhtmltopdf
      - name: Start MongoDB 5.0 fixture
        shell: bash
        run: |
          docker rm -f leanote-test-mongo >/dev/null 2>&1 || true
          docker run -d --rm --name leanote-test-mongo -p 27017:27017 mongo:5.0
          deadline=$((SECONDS + 60))
          while true; do
            ping="$(docker exec leanote-test-mongo mongosh --quiet --eval 'db.runCommand({ping:1}).ok' 2>/dev/null || true)"
            if [ "$(printf '%s' "$ping" | tr -d '[:space:]')" = '1' ]; then break; fi
            if [ "$SECONDS" -ge "$deadline" ]; then echo 'Mongo ping timeout after 60s' >&2; exit 1; fi
            sleep 0.5
          done
          docker cp mongodb_backup/leanote_install_data leanote-test-mongo:/
          docker exec leanote-test-mongo mongorestore --db leanote_test --dir /leanote_install_data --drop
          test "$(docker exec leanote-test-mongo mongosh --quiet leanote_test --eval 'db.users.countDocuments()' | tr -d '[:space:]')" = '2'
      - name: Verify legacy auth test
        env:
          LEANOTE_REQUIRE_MONGO: '1'
        run: go test -p 1 ./app/tests/ -run '^TestAuth$' -count=1 -timeout 60s
      - name: Replay Go baseline
        env:
          LEANOTE_GOLDEN: replay
        run: go test -p 1 ./app/tests/... -count=1 -timeout 30m
      - name: Remove MongoDB fixture
        if: always()
        run: docker rm -f leanote-test-mongo >/dev/null 2>&1 || true

  node-tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.7'
      - name: Initialize sanitized build smoke summary
        shell: bash
        run: |
          mkdir -p test-results
          node --input-type=module -e "import fs from 'node:fs/promises'; const summary={tool:{node:process.version,playwright:'1.62.1'},stage:'ci-harness-starting',service:{baseUrl:'http://127.0.0.1:9000',readiness:'unknown',status:null,exitCode:null},auth:{finalUrl:null,authenticated:false},pages:[],resources:[],errors:[]}; await fs.writeFile('test-results/build-smoke-summary.json',JSON.stringify(summary,null,2)+'\\n'); await fs.writeFile('test-results/service-health-summary.json',JSON.stringify({tool:summary.tool,stage:summary.stage,service:summary.service},null,2)+'\\n')"
      - name: Build Revel CLI from the main module graph
        id: revel-cli
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/leanote-bin"
          go build -o "$RUNNER_TEMP/leanote-bin/revel" github.com/revel/cmd/revel
          go version -m "$RUNNER_TEMP/leanote-bin/revel" | grep -F 'golang.org/x/tools v0.49.0'
          echo "$RUNNER_TEMP/leanote-bin" >> "$GITHUB_PATH"
      - name: Record Revel CLI failure in sanitized summary
        if: always() && steps.revel-cli.outcome == 'failure'
        run: node scripts/ci/update-build-summary.mjs ci-revel-cli revel-cli
      - name: Start MongoDB 5.0 fixture for build smoke
        id: mongo-fixture
        shell: bash
        run: |
          docker rm -f leanote-build-smoke-mongo >/dev/null 2>&1 || true
          docker run -d --rm --name leanote-build-smoke-mongo -p 27017:27017 mongo:5.0
          deadline=$((SECONDS + 60))
          while true; do
            ping="$(docker exec leanote-build-smoke-mongo mongosh --quiet --eval 'db.runCommand({ping:1}).ok' 2>/dev/null || true)"
            if [ "$(printf '%s' "$ping" | tr -d '[:space:]')" = '1' ]; then break; fi
            if [ "$SECONDS" -ge "$deadline" ]; then echo 'Mongo ping timeout after 60s' >&2; exit 1; fi
            sleep 0.5
          done
          docker cp mongodb_backup/leanote_install_data leanote-build-smoke-mongo:/
          docker exec leanote-build-smoke-mongo mongorestore --db leanote --dir /leanote_install_data --drop
          docker exec leanote-build-smoke-mongo mongorestore --db leanote_test --dir /leanote_install_data --drop
      - name: Record Mongo fixture failure in sanitized summary
        if: always() && steps.mongo-fixture.outcome == 'failure'
        run: node scripts/ci/update-build-summary.mjs ci-mongo-fixture mongo-fixture
      - name: Start Leanote service for build smoke
        id: service-start
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/leanote-build-smoke.exit"
          nohup setsid bash -c 'revel run -a .; code=$?; printf "%s\\n" "$code" > "$1"; exit "$code"' leanote "$RUNNER_TEMP/leanote-build-smoke.exit" > "$RUNNER_TEMP/leanote-build-smoke.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/leanote-build-smoke.pid"
          deadline=$((SECONDS + 120))
          while true; do
            if curl --fail --silent --show-error --max-time 3 http://127.0.0.1:9000/login >/dev/null; then break; fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo 'Leanote service readiness timeout' >&2
              exit 1
            fi
            if ! kill -0 "$(cat "$RUNNER_TEMP/leanote-build-smoke.pid")" 2>/dev/null; then
              echo 'Leanote service exited before readiness' >&2
              exit 1
            fi
            sleep 1
          done
      - name: Record service startup failure in sanitized summary
        if: always() && steps.service-start.outcome == 'failure'
        run: node scripts/ci/update-build-summary.mjs ci-service-start service-start
      - name: Record service readiness in sanitized summary
        if: steps.service-start.outcome == 'success'
        run: node scripts/ci/update-build-summary.mjs service-ready runner-error
      - run: npm ci
      - run: npm run build
      - name: Verify generated assets are tracked and clean
        shell: bash
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
      - run: npm test
      - name: Install Playwright Chromium
        run: npm exec -- playwright install chromium
      - name: Run build resource smoke
        env:
          LEANOTE_BASE_URL: http://127.0.0.1:9000
          LEANOTE_E2E_EMAIL: ${{ secrets.LEANOTE_E2E_EMAIL }}
          LEANOTE_E2E_PASSWORD: ${{ secrets.LEANOTE_E2E_PASSWORD }}
        run: npm run test:e2e:build
      - name: Stop Leanote build smoke harness
        if: always()
        shell: bash
        run: |
          cleanup_failed=0
          pid=''
          if [ -f "$RUNNER_TEMP/leanote-build-smoke.pid" ]; then
            pid="$(cat "$RUNNER_TEMP/leanote-build-smoke.pid")"
            kill -- -"$pid" >/dev/null 2>&1 || kill "$pid" >/dev/null 2>&1 || true
            for _ in $(seq 1 20); do
              if ! kill -0 "$pid" >/dev/null 2>&1; then break; fi
              sleep 1
            done
          fi
          service_exit_code=''
          if [ -f "$RUNNER_TEMP/leanote-build-smoke.exit" ]; then
            service_exit_code="$(cat "$RUNNER_TEMP/leanote-build-smoke.exit")"
          fi
          node scripts/ci/update-build-summary.mjs service-stopped runner-error "$service_exit_code" || cleanup_failed=1
          for _ in $(seq 1 20); do
            if ! curl --silent --max-time 2 http://127.0.0.1:9000/ >/dev/null 2>&1; then break; fi
            sleep 1
          done
          if curl --silent --max-time 2 http://127.0.0.1:9000/ >/dev/null 2>&1; then
            node scripts/ci/update-build-summary.mjs ci-cleanup cleanup || cleanup_failed=1
            cleanup_failed=1
          fi
          docker rm -f leanote-build-smoke-mongo >/dev/null 2>&1 || cleanup_failed=1
          rm -f "$RUNNER_TEMP/leanote-build-smoke.pid" "$RUNNER_TEMP/leanote-build-smoke.log" "$RUNNER_TEMP/leanote-build-smoke.exit" || cleanup_failed=1
          if [ "$cleanup_failed" -ne 0 ]; then
            exit 1
          fi
      - name: Upload sanitized build summary
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-smoke-summary
          path: |
            test-results/build-smoke-summary.json
            test-results/service-health-summary.json
          if-no-files-found: ignore
          retention-days: 7

  record-export-pdf:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.7'
      - name: Install wkhtmltopdf 0.12.6.1
        shell: bash
        run: |
          wget -q -O wkhtmltox_0.12.6.1-3.jammy_amd64.deb https://github.com/wkhtmltopdf/packaging/releases/download/0.12.6.1-3/wkhtmltox_0.12.6.1-3.jammy_amd64.deb
          echo '4f723b2691ad8638a9df960e0421d346d7315083e3583a334f33362280ddba15  wkhtmltox_0.12.6.1-3.jammy_amd64.deb' | sha256sum -c -
          sudo dpkg -i wkhtmltox_0.12.6.1-3.jammy_amd64.deb || (sudo apt-get -f install -y && sudo dpkg -i wkhtmltox_0.12.6.1-3.jammy_amd64.deb)
          test -x /usr/local/bin/wkhtmltopdf
      - name: Start MongoDB 5.0 fixture
        shell: bash
        run: |
          docker rm -f leanote-test-mongo >/dev/null 2>&1 || true
          docker run -d --rm --name leanote-test-mongo -p 27017:27017 mongo:5.0
          deadline=$((SECONDS + 60))
          while true; do
            ping="$(docker exec leanote-test-mongo mongosh --quiet --eval 'db.runCommand({ping:1}).ok' 2>/dev/null || true)"
            if [ "$(printf '%s' "$ping" | tr -d '[:space:]')" = '1' ]; then break; fi
            if [ "$SECONDS" -ge "$deadline" ]; then echo 'Mongo ping timeout after 60s' >&2; exit 1; fi
            sleep 0.5
          done
          docker cp mongodb_backup/leanote_install_data leanote-test-mongo:/
          docker exec leanote-test-mongo mongorestore --db leanote_test --dir /leanote_install_data --drop
          test "$(docker exec leanote-test-mongo mongosh --quiet leanote_test --eval 'db.users.countDocuments()' | tr -d '[:space:]')" = '2'
      - name: Record ExportPdf golden
        env:
          LEANOTE_GOLDEN: record
        run: go test -p 1 ./app/tests/... -count=1 -timeout 30m -run '^TestGoldenExportPdf$'
      - name: Upload ExportPdf golden for review
        uses: actions/upload-artifact@v4
        with:
          name: export-pdf-golden
          path: app/tests/golden/api/note_exportPdf.json
          if-no-files-found: error
          retention-days: 7
      - name: Remove MongoDB fixture
        if: always()
        run: docker rm -f leanote-test-mongo >/dev/null 2>&1 || true
