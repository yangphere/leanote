name: GHCR live verification
run-name: ${{ github.event.head_commit.message }}

on:
  push:
    branches: [codex/ghcr-live-verification-20261004-84f31d]

concurrency:
  group: ghcr-live-verification-20261004-84f31d
  queue: max
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  hold:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Hold the workflow concurrency slot
        env:
          RUN_LABEL: ${{ github.event.head_commit.message }}
        run: |
          set -eu
          echo "Concurrency slot started at $(date -u +%FT%TZ)"
          case "$RUN_LABEL" in
            'GHCR live verification 1') sleep 90 ;;
            'GHCR live verification 2'|'GHCR live verification 3') sleep 5 ;;
            *) echo 'Unexpected validation label'; exit 1 ;;
          esac
          echo "Concurrency slot released at $(date -u +%FT%TZ)"
  promotion:
    if: github.event.head_commit.message == 'GHCR live verification 1'
    needs: hold
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_REPOSITORY: ghcr.io/yangphere/leanote-ghcr-live-verification-20261004-84f31d
      SKOPEO_IMAGE: quay.io/skopeo/stable@sha256:249b92db7297e5c801e19172dbb3b56fde88094a49740a5ededac8c2958bf2c0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with: { node-version: '24.20.0' }
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
      - name: Verify real isolated GHCR promotion with the reviewed helpers
        env:
          GH_TOKEN: ${{ github.token }}
          GHCR_IMAGE: yangphere/leanote-ghcr-live-verification-20261004-84f31d
        run: bash .github/scripts/ghcr-live-verification.sh
      - name: Save registry evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ghcr-live-verification
          path: ${{ runner.temp }}/evidence
          if-no-files-found: error
          retention-days: 7
