<!DOCTYPE html>
<html lang="{{.locale}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{msg . "accountSetting"}} - Leanote</title>
<link href="/css/bootstrap.css" rel="stylesheet">
<link href="/css/font-awesome-4.2.0/css/font-awesome.css" rel="stylesheet">
<link href="/css/index.css" rel="stylesheet">
<style>
body#boxBody.account-page,
body.account-page {
  min-height: 100vh;
  margin: 0;
  padding: 0;
  background-color: #65bd77;
}

.account-page #box {
  margin: 0;
  padding-top: 30px;
  color: #000;
}

.account-page .account-shell {
  width: 500px;
  max-width: 100%;
  margin: 0 auto;
}

.account-page #accountInfoDialog {
  width: 100%;
  max-width: none;
  margin: 0;
}

.account-page .modal-dialog.modal-sm {
  width: 100%;
  max-width: none;
  margin: 0;
}

.account-page .modal-content {
  background-color: #fff;
  border: 0;
  border-radius: 2px;
  box-shadow: none;
  overflow: hidden;
}

.account-page .modal-header {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 10px 15px;
  background-color: #f5f5f5;
  border-bottom: 1px solid transparent;
  border-radius: 2px 2px 0 0;
  min-height: 42px;
}

.account-page .modal-title {
  margin: 0;
  color: #333;
  font-size: 16px;
  font-weight: bold;
  text-align: center;
}

.account-page .btn-close {
  position: absolute;
  right: 15px;
  top: 50%;
  transform: translateY(-50%);
  margin: 0;
  padding: 4px;
  opacity: 0.6;
}

.account-page .btn-close:hover {
  opacity: 1;
}

.account-page .modal-body {
  background-color: #fff;
  padding: 20px 30px 15px;
}

.account-page .nav-tabs {
  border-bottom: 1px solid #e8e8e8;
  margin-bottom: 20px;
  gap: 0;
}

.account-page .nav-tabs .nav-link {
  padding: 8px 16px;
  color: #6c757d;
  font-size: 14px;
  border: 0;
  border-bottom: 2px solid transparent;
  border-radius: 0;
  background: transparent;
  transition: color 0.15s ease-in-out, border-color 0.15s ease-in-out;
}

.account-page .nav-tabs .nav-link:hover {
  color: #198754;
  border-bottom-color: #198754;
  background: transparent;
}

.account-page .nav-tabs .nav-link.active {
  color: #198754;
  font-weight: 500;
  background: transparent;
  border: 0;
  border-bottom: 2px solid #198754;
}

.account-page .form-label,
.account-page .control-label,
.account-page label {
  display: block;
  margin-bottom: 6px;
  color: #333;
  font-size: 14px;
  font-weight: 500;
}

.account-page .form-control {
  height: 38px;
  padding: 6px 12px;
  font-size: 14px;
  color: #333;
  background-color: #fff;
  border: 1px solid #ced4da;
  border-radius: 3px;
  box-shadow: none;
}

.account-page .form-control:focus {
  border-color: #86b7fe;
  outline: 0;
  box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25);
}

.account-page .mb-3 {
  margin-bottom: 1rem !important;
  color: #6c757d;
  font-size: 13px;
}

.account-page .btn-success {
  display: inline-block;
  padding: 6px 16px;
  font-size: 14px;
  font-weight: 500;
  color: #fff;
  background-color: #198754;
  border: 1px solid #198754;
  border-radius: 3px;
  cursor: pointer;
}

.account-page .btn-success:hover {
  background-color: #157347;
  border-color: #146c43;
  color: #fff;
}

.account-page .modal-footer {
  background-color: #fff;
  border-top: 1px dashed #e8e8e8;
  padding: 15px 30px 20px;
  margin-top: 10px;
  display: flex;
  justify-content: flex-end;
}

.account-page .modal-footer .btn-secondary {
  padding: 6px 16px;
  font-size: 14px;
  font-weight: 500;
  color: #fff;
  background-color: #6c757d;
  border: 1px solid #6c757d;
  border-radius: 3px;
  cursor: pointer;
}

.account-page .modal-footer .btn-secondary:hover {
  background-color: #5c636a;
  border-color: #565e64;
  color: #fff;
}

.account-page #boxFooter {
  text-align: center;
  margin-top: 20px;
  color: #fff;
}

.account-page #boxFooter p {
  margin-bottom: 5px;
}

.account-page #boxFooter a {
  color: #fff;
  text-decoration: none;
}

.account-page #boxFooter a:hover {
  color: #eee;
  text-decoration: underline;
}

@media (max-width: 575.98px) {
  .account-page #box {
    padding-top: 16px;
  }

  .account-page .account-shell {
    width: calc(100% - 24px);
    margin: 0 12px;
  }

  .account-page .modal-body,
  .account-page .modal-footer,
  .account-page .modal-header {
    padding-right: 16px;
    padding-left: 16px;
  }

  .account-page .nav-tabs .nav-link {
    padding: 8px 10px;
    font-size: 13px;
  }
}
</style>
<script src="/js/jquery-1.9.0.min.js"></script>
<script src="/js/bootstrap.js"></script>
<script src="/js/common.js"></script>
</head>
<body id="boxBody" class="account-page">
<section id="box" class="animated fadeInUp">
  <main class="account-shell">
    {{template "user/account.html" .}}
  </main>
</section>

<div id="boxFooter">
  <p>
    <a href="/login">{{msg . "login"}}</a>
    &nbsp;
    <a href="/index">{{msg . "home"}}</a>
  </p>
  <p>
    © <a href="https://leanote.com">Leanote</a>
  </p>
</div>

<script>
(function() {
  var accountInfoDialog = document.getElementById("accountInfoDialog");
  if (!accountInfoDialog) {
    return;
  }

  accountInfoDialog.addEventListener("click", function(event) {
    var target = event.target;
    if (!(target instanceof Element) || !target.closest('[data-bs-dismiss="modal"]')) {
      return;
    }

    event.preventDefault();
    event.stopPropagation();
    window.location.assign("/login");
  }, true);
})();
</script>
</body>
</html>
